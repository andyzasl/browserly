name: Browserly CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for release (e.g., v1.0.0, or leave empty to auto-increment)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14
    permissions:
      contents: write
      checks: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Swift Version
        run: |
          swift --version
          swift test --help

      - name: Determine Version
        id: get_version
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            BASE_VERSION="v1.0.0"
          else
            VERSION_STR=${LATEST_TAG#v}
            IFS='.' read -r major minor patch <<< "$VERSION_STR"
            next_patch=$((patch + 1))
            BASE_VERSION="v${major}.${minor}.${next_patch}"
          fi
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VERSION="$BASE_VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$BASE_VERSION"
          else
            VERSION="${BASE_VERSION}-dev"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION"

      - name: Inject Version into Info.plist
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # Strip 'v' prefix if present for Info.plist compatibility
          VERSION_CLEAN=$(echo $VERSION | sed 's/^v//')
          echo "Injecting version $VERSION_CLEAN into Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION_CLEAN" Sources/Browserly/Info.plist

      - name: Build App
        run: swift build -c release

      - name: Run Unit Tests
        run: swift test --parallel --xunit-output unit-tests.xml

      - name: Locate Test Report
        if: always()
        run: |
          echo "Searching for unit-tests.xml in current directory:"
          ls -l unit-tests.xml || echo "Not found in root"
          echo "Searching for any .xml files in the entire workspace:"
          find . -name "*.xml"
          echo "Listing .build directory contents (recursive):"
          ls -R .build | grep .xml || echo "No XMLs in .build"

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests Result
          path: "**/*.xml"
          reporter: java-junit

      - name: Run Standalone Validation
        run: swift Tests/Validate.swift

      - name: Run Performance Benchmarks
        run: swift Tests/Performance.swift

      - name: Build DMG
        if: |
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh

      - name: Upload DMG Artifact
        if: |
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: Browserly-DMG
          path: Browserly.dmg

      - name: Create and Push Git Tag
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch')
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if [[ "$VERSION" != *-dev ]]; then
            if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
              echo "Tagging commit with $VERSION"
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$VERSION"
              git push origin "$VERSION"
            else
              echo "Tag $VERSION already exists. Skipping tagging step."
            fi
          fi

  release:
    name: Create Release
    needs: build-and-test
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Browserly-DMG

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-test.outputs.version }}
          name: Release ${{ needs.build-and-test.outputs.version }}
          files: Browserly.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
