name: Browserly CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for release (e.g., v1.0.0, or leave empty to auto-increment)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14
    permissions:
      contents: write
      checks: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Swift Version
        run: |
          swift --version
          swift test --help

      - name: Determine Version
        id: get_version
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            BASE_VERSION="v1.0.0"
          else
            VERSION_STR=${LATEST_TAG#v}
            IFS='.' read -r major minor patch <<< "$VERSION_STR"
            next_patch=$((patch + 1))
            BASE_VERSION="v${major}.${minor}.${next_patch}"
          fi
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VERSION="$BASE_VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$BASE_VERSION"
          else
            VERSION="${BASE_VERSION}-dev"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION"

      - name: Inject Version into Info.plist
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # Strip 'v' prefix if present for Info.plist compatibility
          VERSION_CLEAN=$(echo $VERSION | sed 's/^v//')
          echo "Injecting version $VERSION_CLEAN into Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION_CLEAN" Sources/Browserly/Info.plist

      - name: Build App
        run: swift build -c release

      - name: Run Unit Tests
        run: swift test --parallel --xunit-output unit-tests.xml

      - name: Locate Test Report
        if: always()
        run: |
          echo "Searching for unit-tests.xml in current directory:"
          ls -l unit-tests.xml || echo "Not found in root"
          echo "Searching for any .xml files in the entire workspace:"
          find . -name "*.xml"
          echo "Listing .build directory contents (recursive):"
          ls -R .build | grep .xml || echo "No XMLs in .build"

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests Result
          path: "**/*.xml"
          reporter: java-junit

      - name: Run Standalone Validation
        run: swift Tests/Validate.swift

      - name: Run Performance Benchmarks
        run: swift Tests/Performance.swift

      - name: Build DMG
        if: |
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh

      - name: Upload DMG Artifact
        if: |
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: Browserly-DMG
          path: Browserly.dmg

      - name: Create and Push Git Tag
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch')
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if [[ "$VERSION" != *-dev ]]; then
            if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
              echo "Tagging commit with $VERSION"
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$VERSION"
              git push origin "$VERSION"
            else
              echo "Tag $VERSION already exists. Skipping tagging step."
            fi
          fi

  release:
    name: Create Release
    needs: build-and-test
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Browserly-DMG

      - name: Generate Changelog
        run: |
          git fetch --tags --force
          TARGET_VERSION="${{ needs.build-and-test.outputs.version }}"
          PREV_TAG=$(git tag -l "v*" | grep -v "^${TARGET_VERSION}$" | sort -V | tail -n 1)
          
          if [ -z "$PREV_TAG" ]; then
            COMMIT_RANGE=""
          else
            COMMIT_RANGE="${PREV_TAG}..HEAD"
          fi
          
          echo "Generating changelog for range: $COMMIT_RANGE"
          echo "## Changelog" > changelog.md
          echo "" >> changelog.md
          
          if [ -z "$COMMIT_RANGE" ]; then
            COMMITS=$(git log --format="%s" || true)
          else
            COMMITS=$(git log "$COMMIT_RANGE" --format="%s" || true)
          fi
          
          FEATS=""
          FIXES=""
          OTHERS=""
          
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [[ "$line" == "ci: automate tag creation and patch release on successful build"* ]] || [[ "$line" == "ci:"* ]]; then
              continue
            fi
            
            if [[ "$line" =~ ^feat(\(.*\))?: ]]; then
              msg=$(echo "$line" | sed -E 's/^feat(\(.*\))?://' | xargs)
              FEATS="${FEATS}* ${msg}\n"
            elif [[ "$line" =~ ^fix(\(.*\))?: ]]; then
              msg=$(echo "$line" | sed -E 's/^fix(\(.*\))?://' | xargs)
              FIXES="${FIXES}* ${msg}\n"
            elif [[ "$line" =~ ^(chore|ci|test|refactor|docs|style)(\(.*\))?: ]]; then
              if [[ "$line" =~ ^refactor(\(.*\))?: ]]; then
                msg=$(echo "$line" | sed -E 's/^refactor(\(.*\))?://' | xargs)
                OTHERS="${OTHERS}* ${msg} (refactor)\n"
              elif [[ "$line" =~ ^docs(\(.*\))?: ]]; then
                msg=$(echo "$line" | sed -E 's/^docs(\(.*\))?://' | xargs)
                OTHERS="${OTHERS}* ${msg} (documentation)\n"
              fi
            else
              OTHERS="${OTHERS}* ${line}\n"
            fi
          done <<< "$COMMITS"
          
          ANY_CHANGES=false
          if [ -n "$FEATS" ]; then
            echo "### 🚀 Features" >> changelog.md
            printf "$FEATS" >> changelog.md
            echo "" >> changelog.md
            ANY_CHANGES=true
          fi
          
          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> changelog.md
            printf "$FIXES" >> changelog.md
            echo "" >> changelog.md
            ANY_CHANGES=true
          fi
          
          if [ -n "$OTHERS" ]; then
            echo "### 🧰 General Changes" >> changelog.md
            printf "$OTHERS" >> changelog.md
            echo "" >> changelog.md
            ANY_CHANGES=true
          fi
          
          if [ "$ANY_CHANGES" = false ]; then
            echo "No customer-facing changes in this release." >> changelog.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-test.outputs.version }}
          name: Release ${{ needs.build-and-test.outputs.version }}
          body_path: changelog.md
          files: Browserly.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
